# KeepKey Firmware Release Pipeline
#
# Triggered by version tags (v*) on master.
# Builds BOTH firmware variants (keepkey + keepkey-btconly),
# computes reproducible hashes, and creates a draft GitHub Release.
#
# Git-flow: tag master after merging a release/* or hotfix/* branch.
#
# Usage:
#   git tag v7.11.0
#   git push origin v7.11.0

name: Release

on:
  push:
    tags:
      - 'v*'

env:
  BASE_IMAGE: kktech/firmware:v15

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      fw_version: ${{ steps.version.outputs.fw_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract and verify version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FW_VERSION=$(sed -n '/^project/,/)/p' CMakeLists.txt | grep -oP '\d+\.\d+\.\d+')
          echo "fw_version=${FW_VERSION}" >> "$GITHUB_OUTPUT"
          if [ "$TAG_VERSION" != "$FW_VERSION" ]; then
            echo "::error::Tag (${TAG_VERSION}) != CMakeLists.txt (${FW_VERSION})"
            exit 1
          fi

  build-firmware:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: keepkey
            coin_arg: ""
            bin_name: firmware.keepkey
            build_script: release.sh
          - variant: keepkey-btconly
            coin_arg: "-DCOIN_SUPPORT=BTC"
            bin_name: firmware.keepkey-btconly
            build_script: btcrelease.sh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache base image
        id: cache-base
        uses: actions/cache@v4
        with:
          path: /tmp/base-image.tar
          key: base-image-${{ env.BASE_IMAGE }}

      - name: Pull and cache base image
        if: steps.cache-base.outputs.cache-hit != 'true'
        run: |
          docker pull ${{ env.BASE_IMAGE }}
          docker save ${{ env.BASE_IMAGE }} -o /tmp/base-image.tar

      - name: Load base image from cache
        if: steps.cache-base.outputs.cache-hit == 'true'
        run: docker load -i /tmp/base-image.tar

      - name: Cross-compile firmware (${{ matrix.variant }})
        run: |
          COIN_FLAG="${{ matrix.coin_arg }}"
          docker run --rm \
            -v ${{ github.workspace }}:/root/keepkey-firmware:z \
            ${{ env.BASE_IMAGE }} /bin/sh -c "\
              mkdir /root/build && cd /root/build && \
              cmake -C /root/keepkey-firmware/cmake/caches/device.cmake /root/keepkey-firmware \
                ${COIN_FLAG} \
                -DVARIANTS=NoObsoleteVariants \
                -DCMAKE_BUILD_TYPE=MinSizeRel \
                -DCMAKE_COLOR_MAKEFILE=ON && \
              make && \
              mkdir -p /root/keepkey-firmware/release && \
              cp bin/${{ matrix.bin_name }}.bin /root/keepkey-firmware/release/ && \
              cp bin/${{ matrix.bin_name }}.elf /root/keepkey-firmware/release/ && \
              cp bin/bootloader.bin /root/keepkey-firmware/release/ 2>/dev/null || true && \
              chmod -R a+rw /root/keepkey-firmware/release"

      - name: Compute hashes
        working-directory: release
        run: |
          echo "# KeepKey Firmware v${{ needs.validate.outputs.fw_version }} (${{ matrix.variant }}) — Hash Manifest" > HASHES.txt
          echo "" >> HASHES.txt
          for f in *.bin; do
            [ -f "$f" ] || continue
            FULL_HASH=$(sha256sum "$f" | awk '{print $1}')
            echo "sha256 (full)    $f  $FULL_HASH" >> HASHES.txt
            FILE_SIZE=$(stat -c%s "$f")
            if [ "$FILE_SIZE" -gt 256 ]; then
              PAYLOAD_HASH=$(tail -c +257 "$f" | sha256sum | awk '{print $1}')
              echo "sha256 (payload) $f  $PAYLOAD_HASH" >> HASHES.txt
            fi
            echo "" >> HASHES.txt
          done
          cat HASHES.txt

      - name: Rename artifacts
        working-directory: release
        run: |
          VER="${{ needs.validate.outputs.fw_version }}"
          [ -f ${{ matrix.bin_name }}.bin ] && mv ${{ matrix.bin_name }}.bin "${{ matrix.bin_name }}.v${VER}.bin"
          [ -f ${{ matrix.bin_name }}.elf ] && mv ${{ matrix.bin_name }}.elf "${{ matrix.bin_name }}.v${VER}.elf"
          [ -f bootloader.bin ] && mv bootloader.bin "bootloader.v${VER}.bin"
          ls -lh

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-firmware-${{ matrix.variant }}
          path: release/*
          retention-days: 90

  test:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: keepkey
            coin_arg: ""
          - variant: keepkey-btconly
            coin_arg: "-DCOIN_SUPPORT=BTC"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache base image
        id: cache-base
        uses: actions/cache@v4
        with:
          path: /tmp/base-image.tar
          key: base-image-${{ env.BASE_IMAGE }}

      - name: Pull and cache base image
        if: steps.cache-base.outputs.cache-hit != 'true'
        run: |
          docker pull ${{ env.BASE_IMAGE }}
          docker save ${{ env.BASE_IMAGE }} -o /tmp/base-image.tar

      - name: Load base image from cache
        if: steps.cache-base.outputs.cache-hit == 'true'
        run: docker load -i /tmp/base-image.tar

      - name: Build and test emulator (${{ matrix.variant }})
        run: |
          docker build \
            --build-arg coinsupport="${{ matrix.coin_arg }}" \
            -t kkemu-release-${{ matrix.variant }} -f scripts/emulator/Dockerfile .
          docker run --rm --entrypoint /bin/sh kkemu-release-${{ matrix.variant }} \
            -c "make xunit; RC=\$?; exit \$RC"

  create-release:
    needs: [validate, build-firmware, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Download keepkey firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-firmware-keepkey
          path: artifacts/keepkey

      - name: Download keepkey-btconly firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-firmware-keepkey-btconly
          path: artifacts/keepkey-btconly

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp artifacts/keepkey/*.bin artifacts/keepkey/*.elf artifacts/keepkey/HASHES.txt release-assets/
          cp artifacts/keepkey-btconly/*.bin artifacts/keepkey-btconly/*.elf release-assets/
          # Merge hash manifests
          cat artifacts/keepkey-btconly/HASHES.txt >> release-assets/HASHES.txt
          ls -lh release-assets/

      - name: Generate release body
        run: |
          VER="${{ needs.validate.outputs.fw_version }}"
          cat > release-body.md <<'EOF'
          ## KeepKey Firmware v${VER}

          This release includes two firmware variants:
          - **firmware.keepkey** — Full multi-chain support
          - **firmware.keepkey-btconly** — Bitcoin-only (reduced attack surface)

          ### Reproducible Build Verification
          ```bash
          # Multi-chain
          ./scripts/build/docker/device/release.sh
          tail -c +257 bin/firmware.keepkey.bin | shasum -a 256

          # Bitcoin-only
          ./scripts/build/docker/device/btcrelease.sh
          tail -c +257 bin/firmware.keepkey-btconly.bin | shasum -a 256
          ```

          > **DRAFT** — firmware must be signed by 3/5 key holders before publishing.

          ### Signing Checklist
          - [ ] Built on multiple machines, hashes match (both variants)
          - [ ] Signed on air-gapped machine (3/5 signers)
          - [ ] Storage upgrade tested on production device
          - [ ] Signed .bin uploaded, replacing unsigned
          - [ ] Release notes finalized
          EOF
          # Substitute version into the template
          sed -i "s/\${VER}/${VER}/g" release-body.md

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "Firmware v${{ needs.validate.outputs.fw_version }}"
          body_path: release-body.md
          files: release-assets/*
          fail_on_unmatched_files: true
