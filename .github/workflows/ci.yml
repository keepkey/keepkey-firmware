# KeepKey Firmware CI Pipeline
#
# FAIL FAST — quick checks gate everything, no wasted compute.
#
# Stage 1: GATE (seconds, no Docker)
#   ├─ lint-format        clang-format diff check
#   ├─ static-analysis    cppcheck static analysis
#   ├─ secret-scan        gitleaks credential detection
#   └─ check-submodules   verify all deps present
#
# Stage 2: BUILD (parallel, gated by Stage 1)
#   ├─ build-emulator     Docker image → artifact  [matrix: full / bitcoin-only]
#   └─ build-arm-firmware cross-compile → .bin/.elf (downloadable)  [same matrix]
#
# Stage 3: TEST (parallel, gated by Stage 2)
#   ├─ unit-tests              GoogleTest (make xunit)  [same matrix — proves each
#   │                          variant's coin/token gating actually compiles+passes]
#   └─ python-integration      full test suite  [same matrix]
#
# Stage 4: PUBLISH (manual trigger, all tests must pass)
#   └─ publish-emulator   DockerHub push, full/default variant only (workflow_dispatch only)

name: CI

on:
  push:
    # Topic branches are validated by pull_request below. Running both push and
    # pull_request for the same in-repository branch doubles every expensive
    # firmware/integration leg without adding an independent signal.
    branches: [master, develop]
  pull_request:
    branches: [master, develop, 'release/715-stack-*']
  workflow_dispatch:
    inputs:
      publish_emulator:
        description: 'Publish emulator image to DockerHub'
        required: false
        type: boolean
        default: false

# A lower release-stack update can synchronize several dependent PRs in quick
# succession. Keep only the newest run for each PR; an older head cannot become
# acceptance evidence after GitHub has observed its replacement. Long-lived
# branch pushes retain their full runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job here only reads the repository: checkout, build, and run tests.
# Artifacts move between jobs over the run-scoped artifact token, the GHCR
# mirror read is anonymous with an explicit fallback, and the DockerHub push
# authenticates with its own credentials -- nothing needs a writable
# GITHUB_TOKEN. Declaring the floor once at the workflow level applies it to
# all jobs, so a new job cannot silently inherit write scope.
#
# This closes code-scanning rule actions/missing-workflow-permissions, which
# had one alert open per job.
permissions:
  contents: read

env:
  BASE_IMAGE: kktech/firmware@sha256:7438e53933d47d53157ed6d96d864cb208597e62dce26235ace09d1063427fa2
  # Pulls of the 650 MB base image from Docker Hub cost ~34s per job. The
  # same blob served from GHCR to a GitHub-hosted runner is markedly faster
  # and is not subject to Docker Hub's anonymous pull limits. Populate it
  # with the mirror-base-image workflow; CI falls back to Docker Hub
  # automatically when the mirror is absent or unreadable.
  BASE_IMAGE_MIRROR: ghcr.io/${{ github.repository_owner }}/firmware:sha256-7438e53933d47d53157ed6d96d864cb208597e62dce26235ace09d1063427fa2
  EMU_IMAGE: kkemu-ci

jobs:
  # ═══════════════════════════════════════════════════════════
  # STAGE 1: GATE — kill bad PRs in seconds
  # ═══════════════════════════════════════════════════════════

  lint-format:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # PyPI wheel instead of the LLVM apt repo. Same upstream binary,
      # pinned just as tightly, without `apt-get update` against
      # apt.llvm.org on every run.
      - name: Install clang-format 20 (pinned stable)
        run: |
          python3 -m pip install --quiet --upgrade "clang-format==20.1.8"
          clang-format --version

      - name: Check code formatting
        run: |
          echo "Using: $(clang-format --version)"
          # xargs -P fans the per-file checks across the runner's cores; each
          # clang-format invocation is independent, so the only thing needing
          # coordination is the exit status, which xargs aggregates (123 if
          # any child failed).
          #
          # The pipeline is the `if` condition rather than a bare command
          # because GitHub runs `run:` blocks under `bash -e` -- a bare
          # failing pipeline would abort the step immediately and swallow the
          # remediation message below. Inside an `if`, -e is suspended.
          #
          # shellcheck disable=SC2016  # $1 is expanded by the inner sh, not here
          # lib/transport/src has never existed in this repo -- the transport
          # sources sit directly in lib/transport/. The path silently
          # contributed nothing because find's error went to /dev/null.
          # Dropped, and stderr is no longer suppressed, so a future bad path
          # is loud instead of quietly narrowing coverage.
          #
          # lib/transport itself is deliberately NOT scanned: it holds the
          # vendored nanopb runtime (pb_common.c, pb_decode.c, pb_encode.c).
          # pb_decode.c does not satisfy this repo's .clang-format, and
          # reformatting vendored upstream sources would make future nanopb
          # updates needlessly painful.
          #
          # The name tests are parenthesised so the implicit -print
          # unambiguously applies to both branches.
          if ! find include/keepkey lib/firmware lib/board \
                    \( -name '*.c' -o -name '*.h' \) \
               | grep -v generated | grep -vF '.pb.' \
               | xargs -P "$(nproc)" -I{} sh -c '
                   if ! clang-format --style=file --dry-run --Werror "$1" 2>/dev/null; then
                     echo "::warning file=$1::Formatting differs from .clang-format"
                     exit 1
                   fi
                 ' _ {}
          then
            echo ""
            echo "::error::Code formatting check failed. Run: clang-format -i <file> to fix."
            exit 1
          fi

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install gitleaks
        # Pin and verify the only scanner binary that is installed/executed.
        # Bumps require an independently recorded digest and ruleset review.
        run: |
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_ARCHIVE=/tmp/gitleaks.tar.gz
          curl --fail --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o "${GITLEAKS_ARCHIVE}"
          echo "${GITLEAKS_SHA256}  ${GITLEAKS_ARCHIVE}" | sha256sum --check --strict
          tar -xzf "${GITLEAKS_ARCHIVE}" -C /usr/local/bin gitleaks
          INSTALLED_VERSION=$(gitleaks version)
          echo "gitleaks ${INSTALLED_VERSION}"
          test "${INSTALLED_VERSION}" = "${GITLEAKS_VERSION}"

      - name: Check secret-scan exceptions
        run: python3 -B -m unittest tools/test_gitleaks_allowlists.py

      - name: Run gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # fetch-depth: 0 makes every fork ref available. An unscoped scan
          # therefore walks disconnected keepkey-stack histories that are not
          # ancestors of this firmware change (#544). Scan only the revisions
          # introduced by the triggering event.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            LOG_OPTS="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ "$EVENT_NAME" = "push" ] &&
               [[ ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            LOG_OPTS="${PUSH_BEFORE_SHA}..${GITHUB_SHA}"
          elif [ "$EVENT_NAME" = "push" ]; then
            LOG_OPTS="${GITHUB_SHA}"
          else
            gitleaks detect --source . --no-git --verbose --redact
            exit 0
          fi

          echo "Scanning revision range: ${LOG_OPTS}"
          gitleaks detect --source . --log-opts="${LOG_OPTS}" --verbose --redact

  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: false

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y "cppcheck=$(cat scripts/cppcheck-version)"

      - name: Cache cppcheck analysis
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cppcheck-build
          # Reuse source analysis only within the same architecture, analyzer
          # package, invocation and suppression policy. No legacy fallback.
          key: cppcheck-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/cppcheck-version', 'scripts/cppcheck.sh', '.cppcheck-suppressions') }}-${{ github.sha }}
          restore-keys: |
            cppcheck-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/cppcheck-version', 'scripts/cppcheck.sh', '.cppcheck-suppressions') }}-

      - name: Run cppcheck
        run: |
          mkdir -p .cppcheck-build

          : > cppcheck_report.txt
          CPPCHECK_RC=0
          sh scripts/cppcheck.sh cppcheck_report.txt || CPPCHECK_RC=$?

          # Count issues by severity
          ERRORS=$(grep -c '\berror:' cppcheck_report.txt 2>/dev/null || true)
          WARNINGS=$(grep -c '\bwarning:' cppcheck_report.txt 2>/dev/null || true)
          STYLE=$(grep -c '\bstyle:' cppcheck_report.txt 2>/dev/null || true)
          PERF=$(grep -c '\bperformance:' cppcheck_report.txt 2>/dev/null || true)
          PORT=$(grep -c '\bportability:' cppcheck_report.txt 2>/dev/null || true)
          : "${ERRORS:=0}" "${WARNINGS:=0}" "${STYLE:=0}" "${PERF:=0}" "${PORT:=0}"
          TOTAL=$((ERRORS + WARNINGS + STYLE + PERF + PORT))

          {
            echo "## cppcheck summary"
            echo "| Severity | Count |"
            echo "|----------|-------|"
            echo "| error | $ERRORS |"
            echo "| warning | $WARNINGS |"
            echo "| style | $STYLE |"
            echo "| performance | $PERF |"
            echo "| portability | $PORT |"
            echo "| **total** | **$TOTAL** |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Print findings as GitHub annotations
          cat cppcheck_report.txt

          if [ "$CPPCHECK_RC" -ne 0 ]; then
            echo "::error::cppcheck exited with error code $CPPCHECK_RC"
            exit 1
          fi

          if [ "$TOTAL" -gt 0 ]; then
            echo "::error::cppcheck found $TOTAL issue(s) — zero-warning policy enforced"
            exit 1
          fi

          echo "cppcheck: clean — zero findings"

      - name: Upload cppcheck report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cppcheck-report
          path: cppcheck_report.txt
          retention-days: 30

  check-submodules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Validate release report evidence gates
        run: |
          python3 -B -m unittest scripts/test_preflight_cppcheck.py
          # The SRAM gate must keep refusing unbounded (dynamic) stack frames.
          pip install --quiet pyelftools
          PYTHONPATH=tools python3 -B -m unittest tools/test_check_sram_budget.py

      - name: Verify submodules are declared
        run: |
          echo "Checking required submodule declarations..."
          REQUIRED=(
            "deps/crypto/trezor-firmware"
            "deps/device-protocol"
            "deps/python-keepkey"
            "deps/googletest"
            "deps/qrenc/QR-Code-generator"
            "deps/sca-hardening/SecAESSTM32"
          )
          FAILED=0
          for sub in "${REQUIRED[@]}"; do
            if ! grep -q "$sub" .gitmodules; then
              echo "::error::Missing required submodule: $sub"
              FAILED=1
            else
              echo "  ✓ $sub"
            fi
          done
          [ "$FAILED" = "0" ] || exit 1

      - name: Enforce RNG source invariants
        run: |
          if grep -q 'RAND_PLATFORM_INDEPENDENT=0' CMakeLists.txt; then
            echo "::error::RAND_PLATFORM_INDEPENDENT is a definedness switch, not a value toggle"
            exit 1
          fi
          grep -q 'add_definitions(-DRAND_PLATFORM_INDEPENDENT)' CMakeLists.txt
          grep -q '#ifndef RAND_PLATFORM_INDEPENDENT' lib/rand/rng.c
          grep -q 'defined(EMULATOR) && defined(__arm__)' lib/rand/rng.c
          if grep -En 'return[[:space:]]+random\(\)' lib/rand/rng.c; then
            echo "::error::Emulator cryptography must not use libc random()"
            exit 1
          fi

  # ═══════════════════════════════════════════════════════════
  # STAGE 2: BUILD — compile only after gate passes
  # ═══════════════════════════════════════════════════════════

  build-emulator:
    needs: [lint-format, check-submodules, secret-scan]
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # full = the shipped multi-chain product; bitcoin-only removes every
          # other chain.
          - variant: full
            label: ""
            cmake_flags: ""
          - variant: bitcoin-only
            label: " (bitcoin-only)"
            cmake_flags: "-DKK_BITCOIN_ONLY=ON"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Init submodules
        run: |
          git submodule update --init deps/crypto/trezor-firmware
          git submodule update --init deps/device-protocol
          git submodule update --init --recursive deps/python-keepkey
          git submodule update --init deps/googletest
          git submodule update --init deps/qrenc/QR-Code-generator
          git submodule update --init deps/sca-hardening/SecAESSTM32

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      # continue-on-error because the mirror is optional by design. Without
      # it a GHCR outage, a revoked package grant, or a token hiccup fails the
      # job here -- before the Docker Hub fallback this login exists to enable
      # ever gets a chance to run. A failed login simply means the subsequent
      # mirror pull is unauthenticated, which takes the fallback path.
      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull base image
        run: |
          # RESOLVED_BASE is the digest-pinned GHCR mirror when it can be
          # pulled, else the same digest from Docker Hub. Every consumer below
          # (docker build, docker run, compose build) is handed RESOLVED_BASE
          # rather than re-tagging, which would need an invalid digest-form tag.
          #
          # stderr is deliberately not suppressed: the fallback stops a mirror
          # problem being fatal, but hiding the error makes auth vs missing tag
          # vs transient network indistinguishable.
          EXPECTED_DIGEST="${BASE_IMAGE#*@}"
          MIRROR_IMAGE="${BASE_IMAGE_MIRROR%:*}@$EXPECTED_DIGEST"
          if docker pull "$MIRROR_IMAGE"; then
            echo "RESOLVED_BASE=$MIRROR_IMAGE" >> "$GITHUB_ENV"
            echo "base image: digest-pinned GHCR mirror"
          else
            echo "::warning::GHCR mirror unavailable — falling back to Docker Hub. Run the mirror-base-image workflow to populate it."
            docker pull "${{ env.BASE_IMAGE }}"
            echo "RESOLVED_BASE=${{ env.BASE_IMAGE }}" >> "$GITHUB_ENV"
            echo "base image: Docker Hub"
          fi


      - name: Build emulator image (${{ matrix.variant }})
        run: |
          # Point FROM at whatever the mirror step resolved. Without this the
          # Dockerfile's digest default is pulled straight from Docker Hub and
          # the GHCR mirror above buys nothing on the heaviest job in the run.
          docker build \
            --build-arg BASE_IMAGE="${RESOLVED_BASE}" \
            -t ${{ env.EMU_IMAGE }}-${{ matrix.variant }} \
            --build-arg coinsupport="${{ matrix.cmake_flags }}" \
            -f scripts/emulator/Dockerfile \
            .

      - name: Save emulator image
        run: docker save ${{ env.EMU_IMAGE }}-${{ matrix.variant }} -o /tmp/emu-image.tar

      - name: Upload emulator image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: emu-image-${{ matrix.variant }}
          path: /tmp/emu-image.tar
          retention-days: 1

  build-arm-firmware:
    needs: [lint-format, check-submodules, secret-scan]
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Both release variants must compile on every PR. Without the
      # bitcoin-only leg, a change that only breaks the KK_BITCOIN_ONLY image
      # goes green here and fails for the first time in the release build.
      matrix:
        include:
          - variant: full
            label: ""
            cmake_flags: ""
          - variant: bitcoin-only
            label: " (bitcoin-only)"
            cmake_flags: "-DKK_BITCOIN_ONLY=ON"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Init submodules
        run: |
          git submodule update --init deps/crypto/trezor-firmware
          git submodule update --init deps/device-protocol
          git submodule update --init --recursive deps/python-keepkey
          git submodule update --init deps/googletest
          git submodule update --init deps/qrenc/QR-Code-generator
          git submodule update --init deps/sca-hardening/SecAESSTM32

      # continue-on-error because the mirror is optional by design. Without
      # it a GHCR outage, a revoked package grant, or a token hiccup fails the
      # job here -- before the Docker Hub fallback this login exists to enable
      # ever gets a chance to run. A failed login simply means the subsequent
      # mirror pull is unauthenticated, which takes the fallback path.
      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull base image
        run: |
          # RESOLVED_BASE is the digest-pinned GHCR mirror when it can be
          # pulled, else the same digest from Docker Hub. Every consumer below
          # (docker build, docker run, compose build) is handed RESOLVED_BASE
          # rather than re-tagging, which would need an invalid digest-form tag.
          #
          # stderr is deliberately not suppressed: the fallback stops a mirror
          # problem being fatal, but hiding the error makes auth vs missing tag
          # vs transient network indistinguishable.
          EXPECTED_DIGEST="${BASE_IMAGE#*@}"
          MIRROR_IMAGE="${BASE_IMAGE_MIRROR%:*}@$EXPECTED_DIGEST"
          if docker pull "$MIRROR_IMAGE"; then
            echo "RESOLVED_BASE=$MIRROR_IMAGE" >> "$GITHUB_ENV"
            echo "base image: digest-pinned GHCR mirror"
          else
            echo "::warning::GHCR mirror unavailable — falling back to Docker Hub. Run the mirror-base-image workflow to populate it."
            docker pull "${{ env.BASE_IMAGE }}"
            echo "RESOLVED_BASE=${{ env.BASE_IMAGE }}" >> "$GITHUB_ENV"
            echo "base image: Docker Hub"
          fi


      - name: Extract firmware version
        id: version
        run: |
          FW_VERSION=$(sed -n '/^project/,/)/p' CMakeLists.txt | grep -oP '\d+\.\d+\.\d+')
          GIT_SHORT=$(git rev-parse --short HEAD)
          echo "fw_version=${FW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "git_short=${GIT_SHORT}" >> "$GITHUB_OUTPUT"
          echo "Firmware version: ${FW_VERSION} (${GIT_SHORT})"

      - name: Cross-compile firmware for ARM (${{ matrix.variant }})
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/root/keepkey-firmware:z \
            "${RESOLVED_BASE}" /bin/sh -ec "\
              mkdir /root/build; cd /root/build; \
              cmake -C /root/keepkey-firmware/cmake/caches/device.cmake /root/keepkey-firmware \
                ${{ matrix.cmake_flags }} \
                -DCMAKE_BUILD_TYPE=MinSizeRel \
                -DCMAKE_COLOR_MAKEFILE=ON; \
              make; \
              mkdir -p /root/keepkey-firmware/bin; \
              cp bin/*.bin /root/keepkey-firmware/bin/; \
              cp bin/*.elf /root/keepkey-firmware/bin/; \
              if ls bin/*.map >/dev/null 2>&1; then \
                cp bin/*.map /root/keepkey-firmware/bin/; \
              fi; \
              if command -v arm-none-eabi-size >/dev/null 2>&1; then \
                arm-none-eabi-size -A bin/firmware.keepkey.elf > /root/keepkey-firmware/bin/firmware.keepkey.size.txt; \
              fi; \
              find . -name '*.su' -print0 | tar czf /root/keepkey-firmware/bin/stack-usage.tgz --null -T -; \
              chmod -R a+rw /root/keepkey-firmware/bin"

      - name: Enforce firmware-only 7.15 artifacts (${{ matrix.variant }})
        run: |
          python3 - <<'PY'
          from pathlib import Path

          outputs = Path("bin")
          forbidden = sorted(
              p.name for p in outputs.iterdir()
              if p.is_file() and p.name.startswith(
                  ("bootloader.", "blupdater.", "bootstrap.")))
          if forbidden:
              raise SystemExit(
                  "C-2 forbids bootloader/updater/bootstrap artifacts: "
                  + ", ".join(forbidden))
          PY

      # SRAM budget gate — RC7's zcash-privacy variant hard-faulted on boot
      # because static SRAM left an 11.2 KB gap while msg_write() carried a
      # 12.4 KB stack frame. keepkey.ld now ASSERTs a 16 KiB reserve at link
      # time; this step reports the numbers and enforces the frame margin
      # (tools/sram-budgets.json).
      - name: SRAM budget gate (${{ matrix.variant }})
        run: |
          pip install --quiet pyelftools
          python3 tools/check_sram_budget.py \
            --elf bin/firmware.keepkey.elf \
            --su-tar bin/stack-usage.tgz \
            --budgets tools/sram-budgets.json \
            --variant "${{ matrix.variant }}"

      - name: Rename firmware artifacts
        run: |
          cd bin
          for f in *.bin; do
            [ -f "$f" ] || continue
            mv "$f" "firmware.keepkey.v${{ steps.version.outputs.fw_version }}-${{ steps.version.outputs.git_short }}-${{ matrix.variant }}-${f}"
          done
          for f in *.elf; do
            [ -f "$f" ] || continue
            mv "$f" "firmware.keepkey.v${{ steps.version.outputs.fw_version }}-${{ steps.version.outputs.git_short }}-${{ matrix.variant }}-${f}"
          done
          ls -lh
          echo "::notice::Firmware v${{ steps.version.outputs.fw_version }} (${{ matrix.variant }}) built successfully"

      - name: Bind ARM outputs to source commits
        env:
          ARM_VARIANT: ${{ matrix.variant }}
        run: |
          python3 - <<'PY'
          import datetime
          import glob
          import hashlib
          import json
          import os
          import subprocess

          def digest(path):
              value = hashlib.sha256()
              with open(path, "rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      value.update(chunk)
              return value.hexdigest()

          files = []
          for path in sorted(glob.glob("bin/*.bin") + glob.glob("bin/*.elf")):
              files.append({
                  "name": os.path.basename(path),
                  "sha256": digest(path),
                  "size": os.path.getsize(path),
              })
          if not files:
              raise SystemExit("no ARM outputs found")
          manifest = {
              "schema": 1,
              "generated_at": datetime.datetime.now(
                  datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
              "firmware_sha": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True).strip(),
              "python_sha": subprocess.check_output(
                  ["git", "rev-parse", "HEAD:deps/python-keepkey"],
                  text=True).strip(),
              "variant": os.environ["ARM_VARIANT"],
              "files": files,
          }
          with open("bin/arm-build-manifest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, sort_keys=True, indent=2)
              handle.write("\n")
          PY

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          # matrix.variant in the name: two legs uploading the same artifact
          # name is a hard failure on upload-artifact@v4+ (see release.yml).
          name: firmware-v${{ steps.version.outputs.fw_version }}-${{ steps.version.outputs.git_short }}-${{ matrix.variant }}
          path: |
            bin/*.bin
            bin/*.elf
            bin/arm-build-manifest.json
          retention-days: 90

  # ═══════════════════════════════════════════════════════════
  # STAGE 3: TEST — run only after builds succeed
  # ═══════════════════════════════════════════════════════════

  unit-tests:
    name: unit-tests${{ matrix.label }}
    needs: build-emulator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            label: ""
            cmake_flags: ""
          - variant: bitcoin-only
            label: " (bitcoin-only)"
            cmake_flags: "-DKK_BITCOIN_ONLY=ON"
    steps:
      - name: Download emulator image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: emu-image-${{ matrix.variant }}
          path: /tmp

      - name: Load emulator image
        run: docker load -i /tmp/emu-image.tar

      - name: Run unit tests (${{ matrix.variant }})
        run: |
          # make xunit returns non-zero if any test fails — capture
          # exit code so JUnit XML still gets copied for reporting
          docker run --rm \
            -v ${{ github.workspace }}/test-reports:/kkemu/test-reports \
            --entrypoint /bin/sh \
            ${{ env.EMU_IMAGE }}-${{ matrix.variant }} \
            -c "mkdir -p /kkemu/test-reports/firmware-unit && \
                make xunit; RC=\$?; \
                cp -r unittests/*.xml /kkemu/test-reports/firmware-unit/ 2>/dev/null; \
                exit \$RC"

      # The cp above sends its errors to /dev/null, so a build that stops
      # emitting JUnit XML would leave the report rendering "0 tests". No XML
      # is an infrastructure failure, distinct from a test failure.
      - name: Require unit test JUnit evidence (${{ matrix.variant }})
        if: always()
        run: |
          if ! compgen -G "${{ github.workspace }}/test-reports/firmware-unit/*.xml" > /dev/null; then
            echo "::error::make xunit produced no JUnit XML — unit test evidence was lost"
            exit 1
          fi

      - name: Upload unit test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: unit-test-results-${{ matrix.variant }}
          path: test-reports/firmware-unit/
          retention-days: 30

  python-integration-tests:
    needs: [lint-format, check-submodules, secret-scan]
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            project: kkci-full
            python_artifact: python-test-results
            oled_artifact: oled-screenshots
          - variant: bitcoin-only
            project: kkci-bitcoin-only
            python_artifact: python-test-results-bitcoin-only
            oled_artifact: oled-screenshots-bitcoin-only
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Init submodules
        run: |
          git submodule update --init deps/crypto/trezor-firmware
          git submodule update --init deps/device-protocol
          git submodule update --init --recursive deps/python-keepkey
          git submodule update --init deps/googletest
          git submodule update --init deps/qrenc/QR-Code-generator
          git submodule update --init deps/sca-hardening/SecAESSTM32

      # continue-on-error because the mirror is optional by design. Without
      # it a GHCR outage, a revoked package grant, or a token hiccup fails the
      # job here -- before the Docker Hub fallback this login exists to enable
      # ever gets a chance to run. A failed login simply means the subsequent
      # mirror pull is unauthenticated, which takes the fallback path.
      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull base image
        run: |
          # RESOLVED_BASE is the digest-pinned GHCR mirror when it can be
          # pulled, else the same digest from Docker Hub. Every consumer below
          # (docker build, docker run, compose build) is handed RESOLVED_BASE
          # rather than re-tagging, which would need an invalid digest-form tag.
          #
          # stderr is deliberately not suppressed: the fallback stops a mirror
          # problem being fatal, but hiding the error makes auth vs missing tag
          # vs transient network indistinguishable.
          EXPECTED_DIGEST="${BASE_IMAGE#*@}"
          MIRROR_IMAGE="${BASE_IMAGE_MIRROR%:*}@$EXPECTED_DIGEST"
          if docker pull "$MIRROR_IMAGE"; then
            echo "RESOLVED_BASE=$MIRROR_IMAGE" >> "$GITHUB_ENV"
            echo "base image: digest-pinned GHCR mirror"
          else
            echo "::warning::GHCR mirror unavailable — falling back to Docker Hub. Run the mirror-base-image workflow to populate it."
            docker pull "${{ env.BASE_IMAGE }}"
            echo "RESOLVED_BASE=${{ env.BASE_IMAGE }}" >> "$GITHUB_ENV"
            echo "base image: Docker Hub"
          fi


      # Official ERC-7730 registry, pinned to an exact commit (never a moving
      # branch). 9f37816a is the registry revision whose bounded-include
      # expansion yields the 1,450 calldata formats asserted by
      # test_official_registry_all_calldata_formats_reach_firmware. It lands in
      # the build context, so the python-keepkey image carries it. Bitcoin-only
      # has no ERC-7730 engine and neither fetches nor needs it.
      - name: Fetch pinned ERC-7730 registry
        if: matrix.variant == 'full'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ethereum/clear-signing-erc7730-registry
          ref: 9f37816afde954ff6617fb5baa346133e5af26c5
          path: build-inputs/erc7730-registry
          persist-credentials: false

      - name: Verify ERC-7730 registry pin
        if: matrix.variant == 'full'
        run: |
          test "$(git -C build-inputs/erc7730-registry rev-parse HEAD)" = \
            9f37816afde954ff6617fb5baa346133e5af26c5

      - name: Build and run tests (docker compose)
        working-directory: scripts/emulator
        env:
          KK_FIRMWARE_VARIANT: ${{ matrix.variant }}
          KK_CI_REHEARSAL: ${{ vars.KK_CI_REHEARSAL }}
          # docker-compose.yml passes this to every image it builds.
          BASE_IMAGE: ${{ env.RESOLVED_BASE }}
        run: |
          COMPOSE_ARGS=(-f docker-compose.yml)
          if [ "${{ matrix.variant }}" = "bitcoin-only" ]; then
            COMPOSE_ARGS+=(-f docker-compose.bitcoin-only.yml)
          fi

          # Run each test container — capture exit codes, always extract reports
          FW_RC=0
          PY_RC=0
          BUILD_RC=0
          set +e
          # Build once, up twice. The base image was resolved above (GHCR
          # mirror, else Docker Hub) and is passed in as BASE_IMAGE. `|| RC=$?`, never `; RC=$?`: this
          # step runs under bash -e, and the semicolon form aborts before the
          # assignment -- and before the evidence below is extracted.
          docker compose "${COMPOSE_ARGS[@]}" -p ${{ matrix.project }} build || BUILD_RC=$?
          if [ "$BUILD_RC" -eq 0 ]; then
            docker compose "${COMPOSE_ARGS[@]}" -p ${{ matrix.project }} \
              up --exit-code-from firmware-unit firmware-unit || FW_RC=$?
            docker compose "${COMPOSE_ARGS[@]}" -p ${{ matrix.project }} \
              up --exit-code-from python-keepkey python-keepkey || PY_RC=$?
          fi
          set -e

          REPORT_ROOT=${{ github.workspace }}/test-reports/${{ matrix.variant }}
          mkdir -p "$REPORT_ROOT"

          echo "=== Extracting test reports from Docker ==="
          PY_CONTAINER=$(docker compose "${COMPOSE_ARGS[@]}" -p ${{ matrix.project }} ps -a -q python-keepkey)
          FW_CONTAINER=$(docker compose "${COMPOSE_ARGS[@]}" -p ${{ matrix.project }} ps -a -q firmware-unit)

          docker cp "$FW_CONTAINER":/kkemu/test-reports/. "$REPORT_ROOT/" || echo "WARN: firmware-unit docker cp failed"
          docker cp "$PY_CONTAINER":/kkemu/test-reports/. "$REPORT_ROOT/" || echo "WARN: python-keepkey docker cp failed"

          echo "=== Extracted files ==="
          find "$REPORT_ROOT" -type f | head -30
          echo "=== Screenshot PNGs ==="
          find "$REPORT_ROOT/screenshots" -name '*.png' 2>/dev/null | wc -l
          echo "PNGs on host"

          echo "firmware-unit exit code: $FW_RC"
          echo "python-keepkey exit code: $PY_RC"
          echo "compose build exit code: $BUILD_RC"

          if [ "$BUILD_RC" -ne 0 ]; then
            echo "::error::compose build failed (exit code $BUILD_RC)"
          fi

          if [ "$FW_RC" -ne 0 ]; then
            echo "::error::firmware-unit tests failed (exit code $FW_RC)"
          fi
          if [ "$PY_RC" -ne 0 ]; then
            echo "::error::python-keepkey tests failed (exit code $PY_RC)"
          fi
          [ "$BUILD_RC" -eq 0 ] && [ "$FW_RC" -eq 0 ] && [ "$PY_RC" -eq 0 ] || exit 1

          # Extraction is gated, not warned about. A silent `docker cp` failure
          # once let this job go green having lost every integration result.
          if [ ! -s "$REPORT_ROOT/python-keepkey/junit.xml" ]; then
            echo "::error::python-keepkey junit.xml missing or empty after extraction — test results were lost"
            exit 1
          fi

      - name: Upload Python test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ${{ matrix.python_artifact }}
          path: test-reports/${{ matrix.variant }}/python-keepkey/
          retention-days: 30

      - name: Upload native test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: firmware-unit-results-${{ matrix.variant }}
          path: test-reports/${{ matrix.variant }}/firmware-unit/
          retention-days: 30

      - name: Upload OLED screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ${{ matrix.oled_artifact }}
          path: test-reports/${{ matrix.variant }}/screenshots/
          retention-days: 90
          if-no-files-found: ${{ vars.KK_CI_REHEARSAL == '1' && 'ignore' || 'error' }}

      - name: Tear down
        if: always()
        working-directory: scripts/emulator
        run: |
          COMPOSE_ARGS=(-f docker-compose.yml)
          if [ "${{ matrix.variant }}" = "bitcoin-only" ]; then
            COMPOSE_ARGS+=(-f docker-compose.bitcoin-only.yml)
          fi
          docker compose "${COMPOSE_ARGS[@]}" -p ${{ matrix.project }} down -v || true

  # ═══════════════════════════════════════════════════════════
  # STAGE 3a-bis: DYLIB TESTS — libkkemu shared lib via python-keepkey
  # ═══════════════════════════════════════════════════════════
  # Builds the firmware emulator as a shared library (libkkemu.dylib on
  # macOS / .so on Linux when supported) and runs the dylib-specific
  # screenshot regression tests in python-keepkey.
  #
  # macOS-only for now. The duplicate __stack_chk_guard that broke the
  # GNU ld link is gone (only lib/board/keepkey_board.c defines it), but
  # a Linux run of this job has not been added yet.
  #
  # Why a separate job from python-integration-tests:
  #   - Different artifact: .dylib (in-process FFI), not the kkemu
  #     UDP binary the existing job builds.
  #   - Different transport in tests: KK_TRANSPORT=dylib instead of UDP.
  #   - Catches a class of bugs the UDP path hides — the standalone
  #     kkemu binary has its own poll thread; the dylib does not, so
  #     caller-driven polling correctness only surfaces here.
  #
  # Toolchain pinning rationale:
  #   - protoc 3.21.x (matches protobuf 3.20 wire format the firmware
  #     pb2 files expect; newer protoc generates Python that requires
  #     newer protobuf runtime, which breaks the python-keepkey suite).
  #   - protobuf 3.20.3 (Python runtime — strict pin).
  #   - nanopb 0.3.9.4.post3 — NOTE: this is NOT the version the firmware
  #     builder image uses. The pinned image builds nanopb-0.3.9.8 from source
  #     (see Dockerfile). This job installs a different generator via pip, so
  #     headers produced here are not byte-comparable with the firmware build's.
  #     Tracked in GH #425; do not treat this job's output as provenance for
  #     the firmware artifacts.
  #   - KK_DEBUG_LINK=ON (default OFF; without it,
  #     fsm_msgDebugLinkGetState is excluded from the build and any
  #     read_layout() call hangs the test).
  # Cross-builds the Windows emulator DLL (libkkemu.dll) with MinGW-w64 on
  # Linux, so the _WIN32 code paths and cmake/toolchains/mingw-w64-x86_64.cmake
  # cannot rot unnoticed. Build only: no Windows runner executes it here.
  windows-dylib-build:
    needs: [lint-format, check-submodules, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Init submodules
        run: |
          git submodule update --init deps/crypto/trezor-firmware
          git submodule update --init deps/device-protocol
          git submodule update --init --recursive deps/python-keepkey
          git submodule update --init deps/qrenc/QR-Code-generator
          git submodule update --init deps/sca-hardening/SecAESSTM32
          git submodule update --init deps/googletest

      - name: Setup Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'

      - name: Install MinGW-w64 and pinned Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64
          python -m pip install --upgrade pip
          pip install "protobuf==3.20.3" "nanopb==0.3.9.4.post3" requests

      - name: Install pinned protoc 3.21
        run: |
          PROTOC_VERSION=21.12
          curl -sSL -fL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          sudo chmod +x /usr/local/bin/protoc
          protoc --version

      - name: Build nanopb generator's own .pb2 files
        run: |
          NANOPB_PROTO_DIR=$(python -c 'import os, nanopb; print(os.path.dirname(nanopb.__file__))')/generator/proto
          cd "$NANOPB_PROTO_DIR"
          /usr/local/bin/protoc --python_out=. nanopb.proto
          /usr/local/bin/protoc --python_out=. plugin.proto

      - name: Cross-build kkemulator_dylib for Windows
        run: |
          NANOPB_DIR=$(python -c 'import os, nanopb; print(os.path.dirname(nanopb.__file__))')
          export PATH="$PATH:$NANOPB_DIR/generator"
          cmake \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw-w64-x86_64.cmake \
            -DKK_EMULATOR=ON \
            -DKK_BUILD_DYLIB=ON \
            -DKK_DEBUG_LINK=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -B build-win .
          cmake --build build-win --target kkemulator_dylib -j "$(nproc)"
          DLL=$(find build-win -name 'libkkemu*.dll' | head -1)
          test -f "$DLL" || (echo "::error::libkkemu.dll not built" && exit 1)
          ls -la "$DLL"

  python-dylib-tests:
    needs: [lint-format, check-submodules, secret-scan]
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Init submodules
        run: |
          git submodule update --init deps/crypto/trezor-firmware
          git submodule update --init deps/device-protocol
          git submodule update --init --recursive deps/python-keepkey
          git submodule update --init deps/qrenc/QR-Code-generator
          git submodule update --init deps/sca-hardening/SecAESSTM32
          # CMakeLists.txt requires googletest unconditionally even when
          # we only build the dylib target — the project's add_subdirectory
          # for it runs at configure time, before any target selection.
          git submodule update --init deps/googletest

      - name: Setup Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'

      - name: Install pinned Python deps
        run: |
          python -m pip install --upgrade pip
          # Strict version pins — see job-level comment above. `requests`
          # is needed by lib/firmware's ethereum_tokens.def build step
          # (it fetches token-list JSON at compile time).
          pip install "protobuf==3.20.3" "nanopb==0.3.9.4.post3" requests

      - name: Install pinned protoc 3.21
        run: |
          # macos-latest is currently arm64. Pin to that explicitly so a
          # future runner image swap doesn't silently switch to x86 and
          # break the wire-format expectation downstream.
          # Protobuf renamed releases from v3.21.x → v21.x at this point
          # (the protoc "version reset"), so the tag and the file name
          # both drop the leading 3.
          PROTOC_VERSION=21.12
          PROTOC_ASSET="protoc-${PROTOC_VERSION}-osx-aarch_64.zip"
          curl -sSL -fL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ASSET}"
          # `-f` makes curl fail-fast on HTTP errors so we don't unzip
          # a 404 HTML page.
          file /tmp/protoc.zip
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          sudo chmod +x /usr/local/bin/protoc
          protoc --version

      - name: Build nanopb generator's own .pb2 files
        run: |
          # The pip-installed nanopb 0.3.9.4.post3 ships nanopb.proto +
          # plugin.proto but NOT the generated *_pb2.py files. Without
          # them, `nanopb_generator.py` blows up at import time with
          # "ImportError: attempted relative import with no known parent
          # package" the first time the firmware build invokes it.
          #
          # We MUST regenerate with the pinned protoc 3.21 — the system
          # protoc on github-runners is too new and produces .pb2 files
          # that require a newer protobuf runtime than the 3.20.3 we
          # pinned (which would fail with "Descriptors cannot be created
          # directly. ... please regenerate with protoc >= 3.19.0 ...
          # OR downgrade protobuf to 3.20.x").
          NANOPB_PROTO_DIR=$(python -c 'import os, nanopb; print(os.path.dirname(nanopb.__file__))')
          NANOPB_PROTO_DIR="$NANOPB_PROTO_DIR/generator/proto"
          cd "$NANOPB_PROTO_DIR"
          /usr/local/bin/protoc --python_out=. nanopb.proto
          /usr/local/bin/protoc --python_out=. plugin.proto
          ls -la nanopb_pb2.py plugin_pb2.py

      - name: Verify build tools
        run: |
          # macos runners pre-install cmake + Xcode CLI tools (clang,
          # ld, etc). Just sanity-check the versions; no install needed.
          cmake --version
          clang --version

      - name: Configure cmake (KK_EMULATOR + KK_BUILD_DYLIB + KK_DEBUG_LINK)
        run: |
          # Two PATH entries are at play, and order matters:
          #
          #  1. The pip install puts a proper console-script wrapper at
          #     `<pyenv>/bin/protoc-gen-nanopb` that loads nanopb_generator
          #     AS A MODULE so relative imports resolve. setup-python
          #     already adds this bin dir to PATH.
          #
          #  2. cmake's `find_program(NANOPB_GENERATOR nanopb_generator.py)`
          #     wants the .py extension, which only exists in
          #     `<site-packages>/nanopb/generator/`. We APPEND that dir
          #     to PATH (NOT prepend) so the bin/ wrapper still wins for
          #     the `protoc-gen-nanopb` name resolution. The generator/
          #     dir contains its own `protoc-gen-nanopb` raw script that
          #     fails with a relative-import error if it wins.
          #
          # KK_DEBUG_LINK=ON is REQUIRED for screenshot tests — without
          # it fsm_msgDebugLinkGetState is excluded from the build.
          # CMAKE_POLICY_VERSION_MINIMUM works around vendored
          # googletest's pre-3.5 policy declaration.
          NANOPB_DIR=$(python -c 'import os, nanopb; print(os.path.dirname(nanopb.__file__))')
          export PATH="$PATH:$NANOPB_DIR/generator"
          which protoc-gen-nanopb
          which nanopb_generator.py
          cmake \
            -DKK_EMULATOR=1 \
            -DKK_BUILD_DYLIB=1 \
            -DKK_DEBUG_LINK=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -B build-emu .

      - name: Build kkemulator_dylib
        run: |
          NANOPB_DIR=$(python -c 'import os, nanopb; print(os.path.dirname(nanopb.__file__))')
          export PATH="$PATH:$NANOPB_DIR/generator"
          cmake --build build-emu --target kkemulator_dylib -j "$(sysctl -n hw.ncpu)"
          ls -la build-emu/lib/libkkemu* || ls -la build-emu/lib/emulator/libkkemu* || true
          # Surface the resolved binary path for the run step. macOS
          # produces .dylib; .so is preserved as a fallback for when this
          # job goes cross-platform.
          DYLIB=$(find build-emu \( -name 'libkkemu.dylib' -o -name 'libkkemu.so' \) | head -1)
          test -f "$DYLIB" || (echo "::error::libkkemu artifact not found" && exit 1)
          echo "DYLIB_PATH=$(pwd)/$DYLIB" >> "$GITHUB_ENV"

      - name: Run emulator lifecycle and concurrency regressions
        run: |
          cmake --build build-emu --target emulator-unit -j "$(sysctl -n hw.ncpu)"
          mkdir -p test-reports/emulator
          build-emu/bin/emulator-unit --gtest_output=xml:test-reports/emulator/lifecycle.xml

      - name: Upload libkkemu.dylib
        # Always upload, even on later test failure — the binary is
        # what vault and external auditors actually consume from this
        # PR. Tagged with the short commit SHA so multiple PR pushes
        # don't overwrite each other when a reviewer downloads them.
        if: always() && env.DYLIB_PATH != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: libkkemu-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.DYLIB_PATH }}
          retention-days: 30
          if-no-files-found: error

      - name: Install python-keepkey + pytest
        working-directory: deps/python-keepkey
        run: |
          pip install -e .
          # python-keepkey's setup.py doesn't list pytest as a dep;
          # the existing python-integration-tests job runs inside a
          # Docker image that has it baked. We're running on a vanilla
          # macos runner so we install it explicitly. Pin pytest-timeout
          # too — even though pytest-timeout can't break the dylib's C
          # busy-loop (documented at length in the test_dylib_confirm_flow
          # skip rationale), it's a transitive dep some tests use.
          pip install pytest pytest-timeout

      - name: Run dylib screenshot tests
        working-directory: deps/python-keepkey/tests
        env:
          KK_TRANSPORT: dylib
          KK_DYLIB: ${{ env.DYLIB_PATH }}
        run: |
          # `keepkeylib/` on PYTHONPATH so the package's relative-style
          # imports inside generated *_pb2.py files resolve.
          PYTHONPATH=../keepkeylib:.. python -m pytest \
            test_dylib_screenshot.py \
            -v --tb=short --junit-xml=../../../test-reports/dylib-junit.xml

      - name: Upload dylib test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: python-dylib-test-results
          path: |
            test-reports/dylib-junit.xml
            test-reports/emulator/lifecycle.xml
          retention-days: 30
          if-no-files-found: warn

  # ═══════════════════════════════════════════════════════════
  # STAGE 3b: TEST REPORT — generate PDF from test artifacts
  # ═══════════════════════════════════════════════════════════

  generate-test-report:
    needs: [unit-tests, python-integration-tests, python-dylib-tests, build-arm-firmware]
    # Rehearsal runs carry no OLED evidence, so they cannot produce the report.
    if: always() && vars.KK_CI_REHEARSAL != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Download unit test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          # Full results supply the main report and required native contracts.
          name: unit-test-results-full
          path: test-reports/firmware-unit/

      - name: Download bitcoin-only unit test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          # Required native contracts must execute on both products.
          name: unit-test-results-bitcoin-only
          path: test-reports/bitcoin-only/firmware-unit/

      - name: Download python test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-test-results
          path: test-reports/python-keepkey/

      - name: Download bitcoin-only python test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          # Bitcoin-only's own release evidence: base controls, capability
          # census, and the dedicated contract files with their intentional
          # skips.
          name: python-test-results-bitcoin-only
          path: test-reports/bitcoin-only/python-keepkey/

      - name: Download OLED screenshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: oled-screenshots
          path: test-reports/screenshots/

      - name: Download dylib test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-dylib-test-results
          path: test-reports/

      - name: Download ARM firmware
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: firmware-v*
          path: test-reports/arm/
          # Preserve one directory per product. Full and bitcoin-only contain
          # identically named outputs whose bytes intentionally differ.
          merge-multiple: false

      - name: Extract firmware version
        id: version
        run: |
          FW_VERSION=$(sed -n '/^project/,/)/p' CMakeLists.txt | grep -oP '\d+\.\d+\.\d+' || echo "unknown")
          echo "fw_version=${FW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Init python-keepkey submodule
        id: python
        run: |
          git submodule update --init deps/python-keepkey
          echo "sha=$(git rev-parse HEAD:deps/python-keepkey)" >> "$GITHUB_OUTPUT"

      - name: Check report gate regressions
        run: python3 -m unittest scripts/test_generate_test_report.py -v

      - name: Generate test report PDF
        env:
          FW_VERSION: ${{ steps.version.outputs.fw_version }}
          KK_FIRMWARE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          KK_PYTHON_SHA: ${{ steps.python.outputs.sha }}
          KK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          KK_WORKFLOW_EVENT: ${{ github.event_name }}
          KK_FIRMWARE_PR: ${{ github.event.pull_request.html_url }}
          KK_PYTHON_PR: https://github.com/keepkey/python-keepkey/pull/197
        run: python3 scripts/generate-test-report.py

      - name: Upload test report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: test-report
          path: test-report/
          retention-days: 90
          if-no-files-found: error

  release-evidence-gate:
    needs: [unit-tests, python-integration-tests, python-dylib-tests, build-arm-firmware, generate-test-report]
    if: always() && vars.KK_CI_REHEARSAL != '1'
    runs-on: ubuntu-latest
    steps:
      - name: Require every release job
        env:
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          PYTHON_RESULT: ${{ needs.python-integration-tests.result }}
          DYLIB_RESULT: ${{ needs.python-dylib-tests.result }}
          ARM_RESULT: ${{ needs.build-arm-firmware.result }}
          REPORT_RESULT: ${{ needs.generate-test-report.result }}
        run: |
          for result in "$UNIT_RESULT" "$PYTHON_RESULT" "$DYLIB_RESULT" "$ARM_RESULT" "$REPORT_RESULT"; do
            test "$result" = success || exit 1
          done

  # ═══════════════════════════════════════════════════════════
  # STAGE 4: PUBLISH — manual trigger only, all tests must pass

  # ═══════════════════════════════════════════════════════════
  # GATE: one authoritative answer for the whole graph
  # ═══════════════════════════════════════════════════════════
  # A failed gate job SKIPS everything downstream, and skipped is not red.
  # This job runs always() and fails unless every required job is exactly
  # `success`. publish-emulator is dispatch-only, so it is not listed.
  ci-gate:
    name: CI gate
    if: always()
    needs:
      - lint-format
      - secret-scan
      - static-analysis
      - check-submodules
      - build-emulator
      - build-arm-firmware
      - unit-tests
      - python-integration-tests
      - python-dylib-tests
      - windows-dylib-build
      - generate-test-report
      - release-evidence-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert every required job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          KK_CI_REHEARSAL: ${{ vars.KK_CI_REHEARSAL }}
        run: |
          set -euo pipefail
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort
          echo
          # Rehearsal skips only the two evidence jobs; everything else must pass.
          WAIVED='[]'
          if [ "${KK_CI_REHEARSAL:-}" = 1 ]; then
            echo "::warning::REHEARSAL run (KK_CI_REHEARSAL=1): no release evidence produced"
            WAIVED='["generate-test-report","release-evidence-gate"]'
          fi
          NOT_SUCCESS=$(echo "$NEEDS_JSON" | jq -r --argjson waived "$WAIVED" \
            'to_entries[] | select(.value.result != "success")
             | select((.value.result == "skipped" and (.key as $k | $waived | index($k))) | not)
             | .key')
          if [ -n "$NOT_SUCCESS" ]; then
            NOT_SUCCESS_INLINE=$(printf '%s\n' "$NOT_SUCCESS" | tr '\n' ' ')
            echo "::error::Required jobs did not succeed: ${NOT_SUCCESS_INLINE}"
            echo "A skipped or cancelled required job is NOT a pass. If a gate-stage"
            echo "job failed, everything downstream was skipped and produced no signal."
            exit 1
          fi
          echo "All required jobs reported success."

  # ═══════════════════════════════════════════════════════════

  publish-emulator:
    # ci-gate also covers static-analysis,
    # which gates no build job; publishing must not bypass it.
    needs: [ci-gate, release-evidence-gate, build-emulator]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.publish_emulator == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download emulator image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          # Publish the same regular-product image that CI qualifies.
          name: emu-image-full
          path: /tmp

      - name: Load emulator image
        run: docker load -i /tmp/emu-image.tar

      - name: Extract firmware version
        id: version
        run: |
          FW_VERSION=$(sed -n '/^project/,/)/p' CMakeLists.txt | grep -oP '\d+\.\d+\.\d+')
          echo "fw_version=${FW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Firmware version: ${FW_VERSION}"

      - name: Tag images for publish
        run: |
          docker tag ${{ env.EMU_IMAGE }}-full kktech/kkemu:latest
          docker tag ${{ env.EMU_IMAGE }}-full kktech/kkemu:v${{ steps.version.outputs.fw_version }}

      - name: Login to DockerHub
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7
        with:
          username: ${{ secrets.KK_DOCKERHUB_USER }}
          password: ${{ secrets.KK_DOCKERHUB_PASS }}

      - name: Push emulator images
        run: |
          docker push kktech/kkemu:latest
          docker push kktech/kkemu:v${{ steps.version.outputs.fw_version }}
