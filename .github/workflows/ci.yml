# KeepKey Firmware CI Pipeline
#
# FAIL FAST — quick checks gate everything, no wasted compute.
#
# Stage 1: GATE (seconds, no Docker)
#   ├─ lint-format        clang-format diff check
#   ├─ static-analysis    cppcheck static analysis
#   ├─ crypto-tests       pinned fork crypto vectors + ASan/UBSan
#   ├─ secret-scan        gitleaks credential detection
#   └─ check-submodules   verify all deps present
#
# Stage 2: BUILD (parallel, gated by Stage 1)
#   ├─ build-emulator     Docker image → artifact  [matrix: full / bitcoin-only]
#   └─ build-arm-firmware cross-compile → .bin/.elf (downloadable)  [same matrix]
#
# Stage 3: TEST (parallel, gated by Stage 2)
#   ├─ unit-tests              GoogleTest (make xunit)  [same matrix — proves each
#   │                          variant's coin/token gating actually compiles+passes]
#   └─ python-integration      full test suite (full/default variant only)
#
# Stage 4: PUBLISH (manual trigger, all tests must pass)
#   └─ publish-emulator   DockerHub push, full/default variant only (workflow_dispatch only)

name: CI

on:
  push:
    branches: [master, develop, 'feature/**', 'fix/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [master, develop]
  workflow_dispatch:
    inputs:
      publish_emulator:
        description: 'Publish emulator image to DockerHub'
        required: false
        type: boolean
        default: false

env:
  BASE_IMAGE: kktech/firmware@sha256:7438e53933d47d53157ed6d96d864cb208597e62dce26235ace09d1063427fa2
  EMU_IMAGE: kkemu-ci

jobs:
  # ═══════════════════════════════════════════════════════════
  # STAGE 1: GATE — kill bad PRs in seconds
  # ═══════════════════════════════════════════════════════════

  lint-format:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install clang-format-20 (pinned stable)
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -qq && sudo apt-get install -y -qq clang-format-20
          sudo ln -sf /usr/bin/clang-format-20 /usr/bin/clang-format

      - name: Check code formatting
        run: |
          echo "Using: $(clang-format --version)"
          FAILED=0
          for f in $(find include/keepkey lib/firmware lib/board lib/transport/src \
                     -name '*.c' -o -name '*.h' 2>/dev/null | grep -v generated | grep -v '.pb.'); do
            if ! clang-format --style=file --dry-run --Werror "$f" 2>/dev/null; then
              echo "::warning file=$f::Formatting differs from .clang-format"
              FAILED=1
            fi
          done
          if [ "$FAILED" = "1" ]; then
            echo ""
            echo "::error::Code formatting check failed. Run: clang-format -i <file> to fix."
            exit 1
          fi

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -sSf https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | grep -oP '"tag_name":\s*"v\K[^"]+')
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --verbose --redact

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: false

      - name: Init crypto submodule
        run: git submodule update --init deps/crypto/trezor-firmware

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --std=c11 \
            --platform=unspecified \
            --inconclusive \
            --force \
            --inline-suppr \
            --suppressions-list=.cppcheck-suppressions \
            -I include \
            -I deps/crypto/trezor-firmware/crypto \
            -I deps/device-protocol \
            -DSTM32F2=1 \
            -DUSE_ETHEREUM=1 \
            -DUSE_KECCAK=1 \
            -DUSE_NANO=1 \
            -DPB_FIELD_16BIT=1 \
            -DEMULATOR=1 \
            --template='::warning file={file},line={line},col={column}::{severity}: {message} [{id}]' \
            --output-file=cppcheck_report.txt \
            --error-exitcode=1 \
            lib/ include/keepkey/ tools/ 2>&1; CPPCHECK_RC=$?

          # Count issues by severity
          ERRORS=$(grep -c '\berror:' cppcheck_report.txt 2>/dev/null || true)
          WARNINGS=$(grep -c '\bwarning:' cppcheck_report.txt 2>/dev/null || true)
          STYLE=$(grep -c '\bstyle:' cppcheck_report.txt 2>/dev/null || true)
          PERF=$(grep -c '\bperformance:' cppcheck_report.txt 2>/dev/null || true)
          PORT=$(grep -c '\bportability:' cppcheck_report.txt 2>/dev/null || true)
          : "${ERRORS:=0}" "${WARNINGS:=0}" "${STYLE:=0}" "${PERF:=0}" "${PORT:=0}"
          TOTAL=$((ERRORS + WARNINGS + STYLE + PERF + PORT))

          echo "## cppcheck summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Severity | Count |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| error | $ERRORS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| warning | $WARNINGS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| style | $STYLE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| performance | $PERF |" >> "$GITHUB_STEP_SUMMARY"
          echo "| portability | $PORT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **total** | **$TOTAL** |" >> "$GITHUB_STEP_SUMMARY"

          # Print findings as GitHub annotations
          cat cppcheck_report.txt

          if [ "$CPPCHECK_RC" -ne 0 ]; then
            echo "::error::cppcheck exited with error code $CPPCHECK_RC"
            exit 1
          fi

          if [ "$TOTAL" -gt 0 ]; then
            echo "::error::cppcheck found $TOTAL issue(s) — zero-warning policy enforced"
            exit 1
          fi

          echo "cppcheck: clean — zero findings"

      - name: Upload cppcheck report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: cppcheck-report
          path: cppcheck_report.txt
          retention-days: 30

  check-submodules:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Init crypto submodule
        run: git submodule update --init deps/crypto/trezor-firmware

      - name: Verify submodules are declared
        run: |
          echo "Checking required submodule declarations..."
          REQUIRED=(
            "deps/crypto/trezor-firmware"
            "deps/device-protocol"
            "deps/python-keepkey"
            "deps/googletest"
            "deps/qrenc/QR-Code-generator"
            "deps/sca-hardening/SecAESSTM32"
          )
          FAILED=0
          for sub in "${REQUIRED[@]}"; do
            if ! grep -q "$sub" .gitmodules; then
              echo "::error::Missing required submodule: $sub"
              FAILED=1
            else
              echo "  ✓ $sub"
            fi
          done
          [ "$FAILED" = "0" ] || exit 1

      - name: Enforce RC18 security invariants
        run: |
          python3 tools/check_pallas_api_boundary.py
          if git grep -n -E \
            'uses:[[:space:]]+[^#[:space:]]+@(v[0-9]+|main|master)([[:space:]#]|$)' \
            -- .github/workflows; then
            echo "::error::Every GitHub Action must be pinned to a full commit SHA"
            exit 1
          fi
          if git grep -n -E 'kktech/firmware:v[0-9]+' -- \
            .github/workflows scripts/build/docker scripts/emulator; then
            echo "::error::The firmware builder must be pinned by manifest digest"
            exit 1
          fi
          if git grep -n -E 'return[[:space:]]+random\(\)' -- \
            lib/rand/rng.c; then
            echo "::error::Emulator cryptography must not use libc random()"
            exit 1
          fi
          if git grep -n -E \
            'storage_(get|upsert)ClearsignIdentity|persistent_identity_for' \
            -- lib include; then
            echo "::error::Unauthenticated persistent clearsign trust is retired"
            exit 1
          fi
          if git grep -n -F 'option(KK_ZCASH_PRIVACY' -- CMakeLists.txt; then
            echo "::error::Zcash privacy must not become a third release choice"
            exit 1
          fi
          grep -q 'set(KK_ZCASH_PRIVACY ON)' CMakeLists.txt
          grep -q 'set(KK_ZCASH_PRIVACY OFF)' CMakeLists.txt

  crypto-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Init crypto submodule
        run: git submodule update --init deps/crypto/trezor-firmware

      - name: Install crypto test dependencies
        run: sudo apt-get update && sudo apt-get install -y check libssl-dev pkg-config valgrind

      - name: Run optimized crypto suite
        working-directory: deps/crypto/trezor-firmware/crypto
        run: |
          make clean
          make VALGRIND=0 tests/test_check tests/test_pallas_ct
          ./tests/test_check
          ./tests/test_pallas_ct

      - name: Verify Pallas secret flow with Valgrind
        working-directory: deps/crypto/trezor-firmware/crypto
        run: |
          make clean
          make VALGRIND=1 OPTFLAGS='-O2 -g' tests/test_pallas_ct
          valgrind --quiet --error-exitcode=1 --track-origins=yes \
            ./tests/test_pallas_ct

      - name: Run crypto suite with ASan and UBSan
        working-directory: deps/crypto/trezor-firmware/crypto
        run: |
          make clean
          make CC='gcc -fsanitize=address,undefined' VALGRIND=0 \
            OPTFLAGS='-O1 -g -fno-omit-frame-pointer' \
            tests/test_check tests/test_pallas_ct
          # Check's default per-test timeout is too short for the two exhaustive
          # codepoint tests under sanitizer instrumentation on shared runners.
          # Keep the job-level timeout as the hard upper bound.
          CK_DEFAULT_TIMEOUT=30 \
            ASAN_OPTIONS=detect_leaks=0:halt_on_error=1 \
            UBSAN_OPTIONS=halt_on_error=1 ./tests/test_check
          ASAN_OPTIONS=detect_leaks=0:halt_on_error=1 \
            UBSAN_OPTIONS=halt_on_error=1 ./tests/test_pallas_ct

  # ═══════════════════════════════════════════════════════════
  # STAGE 2: BUILD — compile only after gate passes
  # ═══════════════════════════════════════════════════════════

  build-emulator:
    name: build-emulator${{ matrix.label }}
    needs: [lint-format, static-analysis, check-submodules, secret-scan, crypto-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Regular/full includes every supported chain, including Zcash
          # shielded/Orchard. Bitcoin-only is the sole reduced build.
          - variant: full
            label: ""
            cmake_flags: ""
          - variant: bitcoin-only
            label: " (bitcoin-only)"
            cmake_flags: "-DKK_BITCOIN_ONLY=ON"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Init submodules
        run: |
          git submodule update --init deps/crypto/trezor-firmware
          git submodule update --init deps/device-protocol
          git submodule update --init --recursive deps/python-keepkey
          git submodule update --init deps/googletest
          git submodule update --init deps/qrenc/QR-Code-generator
          git submodule update --init deps/sca-hardening/SecAESSTM32

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Cache base image
        id: cache-base
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: /tmp/base-image.tar
          key: base-image-${{ env.BASE_IMAGE }}

      - name: Pull and cache base image
        if: steps.cache-base.outputs.cache-hit != 'true'
        run: |
          docker pull ${{ env.BASE_IMAGE }}
          docker save ${{ env.BASE_IMAGE }} -o /tmp/base-image.tar

      - name: Load base image from cache
        if: steps.cache-base.outputs.cache-hit == 'true'
        run: docker load -i /tmp/base-image.tar

      - name: Build emulator image (${{ matrix.variant }})
        run: |
          docker build \
            -t ${{ env.EMU_IMAGE }}-${{ matrix.variant }} \
            --build-arg coinsupport="${{ matrix.cmake_flags }}" \
            -f scripts/emulator/Dockerfile \
            .

      - name: Save emulator image
        run: docker save ${{ env.EMU_IMAGE }}-${{ matrix.variant }} -o /tmp/emu-image.tar

      - name: Upload emulator image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: emu-image-${{ matrix.variant }}
          path: /tmp/emu-image.tar
          retention-days: 1

  build-arm-firmware:
    name: build-arm-firmware${{ matrix.label }}
    needs: [lint-format, static-analysis, check-submodules, secret-scan, crypto-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            label: ""
            cmake_flags: ""
          - variant: bitcoin-only
            label: " (bitcoin-only)"
            cmake_flags: "-DKK_BITCOIN_ONLY=ON"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Init submodules
        run: |
          git submodule update --init deps/crypto/trezor-firmware
          git submodule update --init deps/device-protocol
          git submodule update --init --recursive deps/python-keepkey
          git submodule update --init deps/googletest
          git submodule update --init deps/qrenc/QR-Code-generator
          git submodule update --init deps/sca-hardening/SecAESSTM32

      - name: Cache base image
        id: cache-base
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: /tmp/base-image.tar
          key: base-image-${{ env.BASE_IMAGE }}

      - name: Pull and cache base image
        if: steps.cache-base.outputs.cache-hit != 'true'
        run: |
          docker pull ${{ env.BASE_IMAGE }}
          docker save ${{ env.BASE_IMAGE }} -o /tmp/base-image.tar

      - name: Load base image from cache
        if: steps.cache-base.outputs.cache-hit == 'true'
        run: docker load -i /tmp/base-image.tar

      - name: Extract firmware version
        id: version
        run: |
          FW_VERSION=$(sed -n '/^project/,/)/p' CMakeLists.txt | grep -oP '\d+\.\d+\.\d+')
          GIT_SHORT=$(git rev-parse --short HEAD)
          echo "fw_version=${FW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "git_short=${GIT_SHORT}" >> "$GITHUB_OUTPUT"
          echo "Firmware version: ${FW_VERSION} (${GIT_SHORT})"

      - name: Cross-compile firmware for ARM (${{ matrix.variant }})
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/root/keepkey-firmware:z \
            ${{ env.BASE_IMAGE }} /bin/sh -c "\
              mkdir /root/build && cd /root/build && \
              cmake -C /root/keepkey-firmware/cmake/caches/device.cmake /root/keepkey-firmware \
                -DCMAKE_BUILD_TYPE=MinSizeRel \
                -DCMAKE_COLOR_MAKEFILE=ON \
                ${{ matrix.cmake_flags }} && \
              make && \
              python3 /root/keepkey-firmware/tools/check_pallas_ct_disassembly.py \
                --elf bin/firmware.keepkey.elf \
                --variant '${{ matrix.variant }}' && \
              mkdir -p /root/keepkey-firmware/bin && \
              cp bin/*.bin /root/keepkey-firmware/bin/ && \
              cp bin/*.elf /root/keepkey-firmware/bin/ && \
              cp bin/*.map /root/keepkey-firmware/bin/ 2>/dev/null || true && \
              arm-none-eabi-size -A bin/firmware.keepkey.elf > /root/keepkey-firmware/bin/firmware.keepkey.size.txt 2>/dev/null || true && \
              find . -name '*.su' -print0 | tar czf /root/keepkey-firmware/bin/stack-usage.tgz --null -T - && \
              chmod -R a+rw /root/keepkey-firmware/bin"

      # SRAM budget gate — RC7's privacy-enabled build hard-faulted on boot
      # because static SRAM left an 11.2 KB gap while msg_write() carried a
      # 12.4 KB stack frame. keepkey.ld now ASSERTs a 16 KiB reserve at link
      # time; this step reports the numbers and enforces the frame margin
      # (tools/sram-budgets.json).
      - name: SRAM budget gate (${{ matrix.variant }})
        run: |
          pip install --quiet pyelftools
          python3 tools/check_sram_budget.py \
            --elf bin/firmware.keepkey.elf \
            --su-tar bin/stack-usage.tgz \
            --budgets tools/sram-budgets.json \
            --variant "${{ matrix.variant }}"

      - name: Rename firmware artifacts
        run: |
          cd bin
          for f in *.bin; do
            [ -f "$f" ] || continue
            mv "$f" "firmware.keepkey.v${{ steps.version.outputs.fw_version }}-${{ steps.version.outputs.git_short }}-${{ matrix.variant }}-${f}"
          done
          for f in *.elf; do
            [ -f "$f" ] || continue
            mv "$f" "firmware.keepkey.v${{ steps.version.outputs.fw_version }}-${{ steps.version.outputs.git_short }}-${{ matrix.variant }}-${f}"
          done
          ls -lh
          echo "::notice::Firmware v${{ steps.version.outputs.fw_version }} (${{ matrix.variant }}) built successfully"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: firmware-v${{ steps.version.outputs.fw_version }}-${{ steps.version.outputs.git_short }}-${{ matrix.variant }}
          path: |
            bin/*.bin
            bin/*.elf
            bin/*.map
            bin/*.size.txt
            bin/stack-usage.tgz
          retention-days: 90

  # ═══════════════════════════════════════════════════════════
  # STAGE 3: TEST — run only after builds succeed
  # ═══════════════════════════════════════════════════════════

  unit-tests:
    name: unit-tests${{ matrix.label }}
    needs: build-emulator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            label: ""
            cmake_flags: ""
          - variant: bitcoin-only
            label: " (bitcoin-only)"
            cmake_flags: "-DKK_BITCOIN_ONLY=ON"
    steps:
      - name: Download emulator image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: emu-image-${{ matrix.variant }}
          path: /tmp

      - name: Load emulator image
        run: docker load -i /tmp/emu-image.tar

      - name: Run unit tests (${{ matrix.variant }})
        run: |
          # make xunit returns non-zero if any test fails — capture
          # exit code so JUnit XML still gets copied for reporting
          docker run --rm \
            -v ${{ github.workspace }}/test-reports:/kkemu/test-reports \
            --entrypoint /bin/sh \
            ${{ env.EMU_IMAGE }}-${{ matrix.variant }} \
            -c "mkdir -p /kkemu/test-reports/firmware-unit && \
                make xunit; RC=\$?; \
                cp -r unittests/*.xml /kkemu/test-reports/firmware-unit/ 2>/dev/null; \
                exit \$RC"

      - name: Upload unit test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: unit-test-results-${{ matrix.variant }}
          path: test-reports/firmware-unit/
          retention-days: 30

  python-integration-tests:
    needs: [lint-format, static-analysis, check-submodules, secret-scan, crypto-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Init submodules
        run: |
          git submodule update --init deps/crypto/trezor-firmware
          git submodule update --init deps/device-protocol
          git submodule update --init --recursive deps/python-keepkey
          git submodule update --init deps/googletest
          git submodule update --init deps/qrenc/QR-Code-generator
          git submodule update --init deps/sca-hardening/SecAESSTM32

      - name: Build and run tests (docker compose)
        working-directory: scripts/emulator
        run: |
          # Run each test container — capture exit codes, always extract reports
          docker compose up --build --exit-code-from firmware-unit firmware-unit; FW_RC=$?
          docker compose up --build --exit-code-from python-keepkey python-keepkey; PY_RC=$?

          mkdir -p ${{ github.workspace }}/test-reports

          echo "=== Extracting test reports from Docker ==="
          PY_CONTAINER=$(docker compose ps -a -q python-keepkey)
          FW_CONTAINER=$(docker compose ps -a -q firmware-unit)

          docker cp "$FW_CONTAINER":/kkemu/test-reports/. ${{ github.workspace }}/test-reports/ || echo "WARN: firmware-unit docker cp failed"
          docker cp "$PY_CONTAINER":/kkemu/test-reports/. ${{ github.workspace }}/test-reports/ || echo "WARN: python-keepkey docker cp failed"

          echo "=== Extracted files ==="
          find ${{ github.workspace }}/test-reports -type f | head -30
          echo "=== Screenshot PNGs ==="
          find ${{ github.workspace }}/test-reports/screenshots -name '*.png' 2>/dev/null | wc -l
          echo "PNGs on host"

          echo "firmware-unit exit code: $FW_RC"
          echo "python-keepkey exit code: $PY_RC"

          if [ "$FW_RC" -ne 0 ]; then
            echo "::error::firmware-unit tests failed (exit code $FW_RC)"
          fi
          if [ "$PY_RC" -ne 0 ]; then
            echo "::error::python-keepkey tests failed (exit code $PY_RC)"
          fi
          [ "$FW_RC" -eq 0 ] && [ "$PY_RC" -eq 0 ] || exit 1

      - name: Upload Python test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: python-test-results
          path: test-reports/python-keepkey/
          retention-days: 30

      - name: Upload OLED screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: oled-screenshots
          path: test-reports/screenshots/
          retention-days: 90
          if-no-files-found: warn

      - name: Tear down
        if: always()
        working-directory: scripts/emulator
        run: docker compose down -v || true

  # ═══════════════════════════════════════════════════════════
  # STAGE 3a-bis: DYLIB TESTS — libkkemu shared lib via python-keepkey
  # ═══════════════════════════════════════════════════════════
  # Builds the firmware emulator as a shared library (libkkemu.dylib on
  # macOS / .so on Linux when supported) and runs the dylib-specific
  # screenshot regression tests in python-keepkey.
  #
  # macOS-only for now. The Linux build hits a duplicate-symbol link
  # error: __stack_chk_guard is defined by both lib/board/keepkey_board.c
  # and lib/emulator/setup.c. The Apple linker silently picks one
  # (matching local macos arm64 builds); GNU ld is strict and fails.
  # Fixing requires deduping the symbol — out of scope for this PR.
  # TODO: enable ubuntu-latest in a follow-up after the symbol cleanup.
  #
  # Why a separate job from python-integration-tests:
  #   - Different artifact: .dylib (in-process FFI), not the kkemu
  #     UDP binary the existing job builds.
  #   - Different transport in tests: KK_TRANSPORT=dylib instead of UDP.
  #   - Catches a class of bugs the UDP path hides — the standalone
  #     kkemu binary has its own poll thread; the dylib does not, so
  #     caller-driven polling correctness only surfaces here.
  #
  # Toolchain pinning rationale:
  #   - protoc 3.21.x (matches protobuf 3.20 wire format the firmware
  #     pb2 files expect; newer protoc generates Python that requires
  #     newer protobuf runtime, which breaks the python-keepkey suite).
  #   - protobuf 3.20.3 (Python runtime — strict pin).
  #   - nanopb 0.3.9.4.post3 (the proto generator the firmware build uses).
  #   - KK_DEBUG_LINK=ON (default OFF; without it,
  #     fsm_msgDebugLinkGetState is excluded from the build and any
  #     read_layout() call hangs the test).
  python-dylib-tests:
    needs: [lint-format, static-analysis, check-submodules, secret-scan, crypto-tests]
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Init submodules
        run: |
          git submodule update --init deps/crypto/trezor-firmware
          git submodule update --init deps/device-protocol
          git submodule update --init --recursive deps/python-keepkey
          git submodule update --init deps/qrenc/QR-Code-generator
          git submodule update --init deps/sca-hardening/SecAESSTM32
          # CMakeLists.txt requires googletest unconditionally even when
          # we only build the dylib target — the project's add_subdirectory
          # for it runs at configure time, before any target selection.
          git submodule update --init deps/googletest

      - name: Setup Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'

      - name: Install pinned Python deps
        run: |
          python -m pip install --upgrade pip
          # Strict version pins — see job-level comment above. `requests`
          # is needed by lib/firmware's ethereum_tokens.def build step
          # (it fetches token-list JSON at compile time).
          pip install "protobuf==3.20.3" "nanopb==0.3.9.4.post3" requests

      - name: Install pinned protoc 3.21
        run: |
          # macos-latest is currently arm64. Pin to that explicitly so a
          # future runner image swap doesn't silently switch to x86 and
          # break the wire-format expectation downstream.
          # Protobuf renamed releases from v3.21.x → v21.x at this point
          # (the protoc "version reset"), so the tag and the file name
          # both drop the leading 3.
          PROTOC_VERSION=21.12
          PROTOC_ASSET="protoc-${PROTOC_VERSION}-osx-aarch_64.zip"
          curl -sSL -fL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ASSET}"
          # `-f` makes curl fail-fast on HTTP errors so we don't unzip
          # a 404 HTML page.
          file /tmp/protoc.zip
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          sudo chmod +x /usr/local/bin/protoc
          protoc --version

      - name: Build nanopb generator's own .pb2 files
        run: |
          # The pip-installed nanopb 0.3.9.4.post3 ships nanopb.proto +
          # plugin.proto but NOT the generated *_pb2.py files. Without
          # them, `nanopb_generator.py` blows up at import time with
          # "ImportError: attempted relative import with no known parent
          # package" the first time the firmware build invokes it.
          #
          # We MUST regenerate with the pinned protoc 3.21 — the system
          # protoc on github-runners is too new and produces .pb2 files
          # that require a newer protobuf runtime than the 3.20.3 we
          # pinned (which would fail with "Descriptors cannot be created
          # directly. ... please regenerate with protoc >= 3.19.0 ...
          # OR downgrade protobuf to 3.20.x").
          NANOPB_PROTO_DIR="$(python -c 'import os, nanopb; print(os.path.dirname(nanopb.__file__))')/generator/proto"
          cd "$NANOPB_PROTO_DIR"
          /usr/local/bin/protoc --python_out=. nanopb.proto
          /usr/local/bin/protoc --python_out=. plugin.proto
          ls -la nanopb_pb2.py plugin_pb2.py

      - name: Verify build tools
        run: |
          # macos runners pre-install cmake + Xcode CLI tools (clang,
          # ld, etc). Just sanity-check the versions; no install needed.
          cmake --version
          clang --version

      - name: Configure cmake (KK_EMULATOR + KK_BUILD_DYLIB + KK_DEBUG_LINK)
        run: |
          # Two PATH entries are at play, and order matters:
          #
          #  1. The pip install puts a proper console-script wrapper at
          #     `<pyenv>/bin/protoc-gen-nanopb` that loads nanopb_generator
          #     AS A MODULE so relative imports resolve. setup-python
          #     already adds this bin dir to PATH.
          #
          #  2. cmake's `find_program(NANOPB_GENERATOR nanopb_generator.py)`
          #     wants the .py extension, which only exists in
          #     `<site-packages>/nanopb/generator/`. We APPEND that dir
          #     to PATH (NOT prepend) so the bin/ wrapper still wins for
          #     the `protoc-gen-nanopb` name resolution. The generator/
          #     dir contains its own `protoc-gen-nanopb` raw script that
          #     fails with a relative-import error if it wins.
          #
          # KK_DEBUG_LINK=ON is REQUIRED for screenshot tests — without
          # it fsm_msgDebugLinkGetState is excluded from the build.
          # CMAKE_POLICY_VERSION_MINIMUM works around vendored
          # googletest's pre-3.5 policy declaration.
          export PATH="$PATH:$(python -c 'import os, nanopb; print(os.path.dirname(nanopb.__file__))')/generator"
          which protoc-gen-nanopb
          which nanopb_generator.py
          cmake \
            -DKK_EMULATOR=1 \
            -DKK_BUILD_DYLIB=1 \
            -DKK_DEBUG_LINK=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -B build-emu .

      - name: Build kkemulator_dylib
        run: |
          export PATH="$PATH:$(python -c 'import os, nanopb; print(os.path.dirname(nanopb.__file__))')/generator"
          cmake --build build-emu --target kkemulator_dylib -j$(sysctl -n hw.ncpu)
          ls -la build-emu/lib/libkkemu* || ls -la build-emu/lib/emulator/libkkemu* || true
          # Surface the resolved binary path for the run step. macOS
          # produces .dylib; .so is preserved as a fallback for when this
          # job goes cross-platform.
          DYLIB=$(find build-emu -name 'libkkemu.dylib' -o -name 'libkkemu.so' | head -1)
          test -f "$DYLIB" || (echo "::error::libkkemu artifact not found" && exit 1)
          echo "DYLIB_PATH=$(pwd)/$DYLIB" >> $GITHUB_ENV

      - name: Upload libkkemu.dylib
        # Always upload, even on later test failure — the binary is
        # what vault and external auditors actually consume from this
        # PR. Tagged with the short commit SHA so multiple PR pushes
        # don't overwrite each other when a reviewer downloads them.
        if: always() && env.DYLIB_PATH != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libkkemu-${{ github.sha }}
          path: ${{ env.DYLIB_PATH }}
          retention-days: 30
          if-no-files-found: error

      - name: Install python-keepkey + pytest
        working-directory: deps/python-keepkey
        run: |
          pip install -e .
          # python-keepkey's setup.py doesn't list pytest as a dep;
          # the existing python-integration-tests job runs inside a
          # Docker image that has it baked. We're running on a vanilla
          # macos runner so we install it explicitly. Pin pytest-timeout
          # too — even though pytest-timeout can't break the dylib's C
          # busy-loop (documented at length in the test_dylib_confirm_flow
          # skip rationale), it's a transitive dep some tests use.
          pip install pytest pytest-timeout

      - name: Run dylib screenshot tests
        working-directory: deps/python-keepkey/tests
        env:
          KK_TRANSPORT: dylib
          KK_DYLIB: ${{ env.DYLIB_PATH }}
        run: |
          # `keepkeylib/` on PYTHONPATH so the package's relative-style
          # imports inside generated *_pb2.py files resolve.
          PYTHONPATH=../keepkeylib:.. python -m pytest \
            test_dylib_screenshot.py \
            -v --tb=short --junit-xml=../../../test-reports/dylib-junit.xml

      - name: Upload dylib test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: python-dylib-test-results
          path: test-reports/dylib-junit.xml
          retention-days: 30
          if-no-files-found: warn

  # ═══════════════════════════════════════════════════════════
  # STAGE 3b: TEST REPORT — generate PDF from test artifacts
  # ═══════════════════════════════════════════════════════════

  generate-test-report:
    needs: [unit-tests, python-integration-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download unit test results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          # Report covers the regular/full build. Bitcoin-only is built and
          # unit-tested in its own matrix leg but does not get a PDF.
          name: unit-test-results-full
          path: test-reports/firmware-unit/

      - name: Download python test results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: python-test-results
          path: test-reports/python-keepkey/

      - name: Download OLED screenshots
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: oled-screenshots
          path: test-reports/screenshots/

      - name: Extract firmware version
        id: version
        run: |
          FW_VERSION=$(sed -n '/^project/,/)/p' CMakeLists.txt | grep -oP '\d+\.\d+\.\d+' || echo "unknown")
          echo "fw_version=${FW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Init python-keepkey submodule
        run: git submodule update --init deps/python-keepkey

      - name: Generate test report PDF
        env:
          FW_VERSION: ${{ steps.version.outputs.fw_version }}
          KK_BUILD_LABEL: ${{ github.head_ref || github.ref_name }}@${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/generate-test-report.py

      - name: Upload test report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-report
          path: test-report.pdf
          retention-days: 90

  # ═══════════════════════════════════════════════════════════
  # STAGE 4: PUBLISH — manual trigger only, all tests must pass
  # ═══════════════════════════════════════════════════════════

  publish-emulator:
    needs: [unit-tests, python-integration-tests, python-dylib-tests, build-arm-firmware]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.publish_emulator == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download emulator image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          # Publish the regular/full image, including Zcash privacy support.
          name: emu-image-full
          path: /tmp

      - name: Load emulator image
        run: docker load -i /tmp/emu-image.tar

      - name: Extract firmware version
        id: version
        run: |
          FW_VERSION=$(sed -n '/^project/,/)/p' CMakeLists.txt | grep -oP '\d+\.\d+\.\d+')
          echo "fw_version=${FW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Firmware version: ${FW_VERSION}"

      - name: Tag images for publish
        run: |
          docker tag ${{ env.EMU_IMAGE }}-full kktech/kkemu:latest
          docker tag ${{ env.EMU_IMAGE }}-full kktech/kkemu:v${{ steps.version.outputs.fw_version }}

      - name: Login to DockerHub
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          username: ${{ secrets.KK_DOCKERHUB_USER }}
          password: ${{ secrets.KK_DOCKERHUB_PASS }}

      - name: Push emulator images
        run: |
          docker push kktech/kkemu:latest
          docker push kktech/kkemu:v${{ steps.version.outputs.fw_version }}
