name: Zoo Report

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize]

jobs:
  zoo-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout firmware (PR head)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: firmware

      - name: Checkout vault-v11 scripts (sparse)
        uses: actions/checkout@v4
        with:
          repository: keepkey/keepkey-vault-v11
          sparse-checkout: |
            scripts/generate-zoo.ts
            scripts/generate-zoo-report.ts
            scripts/zoo-report-package.json
          path: vault

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'

      - name: Install report dependencies
        working-directory: vault/scripts
        run: |
          cp zoo-report-package.json package.json
          bun install

      - name: Generate zoo report PDF
        working-directory: vault
        run: |
          bun scripts/generate-zoo-report.ts \
            --firmware-dir=${{ github.workspace }}/firmware \
            --pr-number=${{ github.event.pull_request.number }} \
            --pr-title="${{ github.event.pull_request.title }}" \
            --output=${{ github.workspace }}/zoo-report.pdf

      - name: Upload zoo report
        uses: actions/upload-artifact@v4
        with:
          name: zoo-report-pr${{ github.event.pull_request.number }}
          path: zoo-report.pdf
          retention-days: 90

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## Zoo Report',
                '',
                'Device screen mockup report generated.',
                '',
                `[Download zoo-report.pdf](${runUrl}#artifacts)`,
                '',
                '27 OLED confirmation screens across 11 flows with security analysis.',
              ].join('\n'),
            });
