version: '3'
services:
  kkemu:
    image: kktech/kkemu:latest
    build:
      context: '../../'
      dockerfile: 'scripts/emulator/Dockerfile'
      # CI passes the base image it resolved (GHCR mirror, else Docker Hub);
      # unset, the Dockerfile's digest-pinned default applies.
      args:
        - BASE_IMAGE
    networks:
      - local-net
    ports:
      - "127.0.0.1:11044:11044/udp"
      - "127.0.0.1:11045:11045/udp"
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\" || exit 1"]
      # The emulator is listening well inside a second; a 3s interval meant
      # the integration suite sat waiting on poll granularity, not on the
      # service. retries is raised alongside so shortening the interval does
      # not also shorten how long a slow start is tolerated -- a failing check
      # can burn up to `timeout` before the next `interval`, so the ceiling is
      # roughly start_period + retries * (timeout + interval), not
      # retries * interval.
      interval: 1s
      timeout: 3s
      retries: 40
      start_period: 3s
  python-keepkey:
    # Named so CI can build every service once (`docker compose build`) and
    # then `up` without --build, which would otherwise rebuild kkemu — the
    # expensive one.
    image: kktech/kkemu-tests:latest
    build:
      context: '../../'
      dockerfile: 'scripts/emulator/python-keepkey.Dockerfile'
      # CI passes the base image it resolved (GHCR mirror, else Docker Hub);
      # unset, the Dockerfile's digest-pinned default applies.
      args:
        - BASE_IMAGE
    volumes:
      - test-reports:/kkemu/test-reports:rw
      # firmware-unit publishes the exact binary for this product variant.
      # The storage gate tests must own and restart that process to cross a
      # real boot boundary; talking only to the long-running kkemu service
      # cannot prove upgrade preservation.
      - emulator-bin:/kkemu-emulator-bin:ro
    environment:
      KK_CI_REHEARSAL: ${KK_CI_REHEARSAL:-}
      # full | bitcoin-only, declared by the caller; the test script refuses
      # to run without it rather than inferring it from the device.
      KK_FIRMWARE_VARIANT: ${KK_FIRMWARE_VARIANT:-}
      KK_EMULATOR_BIN: /kkemu-emulator-bin/kkemu
    networks:
      - local-net
    depends_on:
      kkemu:
        condition: service_healthy
  firmware-unit:
    # CI's python-integration job runs this service for the native unit
    # reports and to publish the emulator binary the storage tests restart.
    image: kktech/kkemu:latest
    build:
      context: '../../'
      dockerfile: 'scripts/emulator/Dockerfile'
      # CI passes the base image it resolved (GHCR mirror, else Docker Hub);
      # unset, the Dockerfile's digest-pinned default applies.
      args:
        - BASE_IMAGE
    volumes:
      - test-reports:/kkemu/test-reports:rw
      - emulator-bin:/kkemu-emulator-bin:rw
    entrypoint: ['scripts/emulator/firmware-unit.sh']
    networks:
      - local-net
    depends_on:
      kkemu:
        condition: service_healthy
networks:
  local-net:
    external: false
volumes:
  test-reports:
    external: false
  emulator-bin:
    external: false
